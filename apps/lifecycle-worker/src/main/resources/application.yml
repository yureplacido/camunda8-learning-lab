spring:
  application:
    name: lifecycle-worker
  main:
    web-application-type: none
camunda:
  client:
    mode: self-managed
    gateway-address: localhost:26500
    rest-address: http://localhost:8080
    worker:
      defaults:
        request-timeout: 30s
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false
