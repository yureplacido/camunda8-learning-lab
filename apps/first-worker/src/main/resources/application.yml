spring:
  application:
    name: first-worker
  main:
    web-application-type: none

camunda:
  client:
    mode: self-managed
    # Endereços no nível de `client`, não de `client.zeebe`: o starter 8.9
    # aceita o caminho antigo, mas emite
    # "Legacy property 'camunda.client.zeebe.rest-address' found" e pede migração.
    gateway-address: localhost:26500
    rest-address: http://localhost:8080
    worker:
      defaults:
        request-timeout: 30s

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false

logging:
  level:
    root: INFO
    com.camunda8.lab: INFO
